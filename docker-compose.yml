services:
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  backend:
    build: ./backend
    volumes:
      - ./backend/app:/app/app
    # Explicit allowlist: a variable reaches the container only if it is
    # listed here. Values come from the repo-root `.env` (compose reads it
    # for `${VAR}` substitution) — add a key here, in `app/config.py`, and
    # in `.env.example` together.
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-HR Scout}
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB=${MONGO_DB:-app}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-claude-opus-5-5}
      - AI_EFFORT=${AI_EFFORT:-medium}
      - AI_REFUSAL_FALLBACK=${AI_REFUSAL_FALLBACK:-true}
      - EXTRACT_MAX_TOKENS=${EXTRACT_MAX_TOKENS:-16000}
      - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-4096}
      - SCRAPE_PAGE_CHARS=${SCRAPE_PAGE_CHARS:-12000}
      - APIFY_TEXT_CHARS=${APIFY_TEXT_CHARS:-15000}
      - APIFY_API_KEY=${APIFY_API_KEY:-}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - SCHEDULER_TICK_SECONDS=${SCHEDULER_TICK_SECONDS:-60}
    depends_on:
      - mongo
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
  frontend-node-modules:
